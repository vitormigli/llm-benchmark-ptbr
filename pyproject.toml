[project]
name = "llm-benchmark-ptbr"
version = "0.1.0"
description = "Reproducible benchmark of Claude model tiers on real Brazilian-Portuguese tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.8",
    "faker>=28.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_benchmark"]
